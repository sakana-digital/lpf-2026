name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: apps/web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Type check
        run: bun --filter lpf-2026-web type-check

      - name: Test
        run: bun --filter lpf-2026-web test

      - name: Build
        run: bun --filter lpf-2026-web build-only
